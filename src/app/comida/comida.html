<div class="encabezado">

  <h1 class="titulo-pagina" id="inicioComida">Comidas</h1>

  <div class="barra-busqueda">

    <select class="filtro" [(ngModel)]="tipoBusqueda">
      <option value="nombre">Buscar por nombre</option>
      <option value="ingrediente">Buscar por ingrediente</option>
    </select>

    <input type="text" class="campo-texto" placeholder="Escribe aquí..." [(ngModel)]="textoBusqueda" (keyup.enter)="buscar()">

    <button class="boton-buscar" (click)="buscar()">Buscar</button>

  </div>

</div>

<div class="categorias">
  <button class="chip" (click)="cargarTodas()">Todos</button>
</div>

<p class="mensaje" *ngIf="error()">{{ error() }}</p>

<div class="resultados">
  <div class="tarjeta-comida" *ngFor="let comida of comidas()">
    <img [src]="comida.strMealThumb" [alt]="comida.strMeal">
    <h3>{{ comida.strMeal }}</h3>
    <p class="precio">$ {{ precios()[comida.idMeal] | number }}</p>
    <button class="boton-agregar" (click)="agregarAlPedido(comida)">Agregar al pedido</button>
    <button class="boton-detalle" (click)="verDetalle(comida)">Ver detalle</button>
  </div>
</div>

<div class="fondo-modal" *ngIf="detalle()" (click)="cerrarDetalle()">
  <div class="modal-detalle" (click)="$event.stopPropagation()">
    <button class="boton-cerrar" (click)="cerrarDetalle()">✕</button>
    <img [src]="detalle()!.strMealThumb" [alt]="detalle()!.strMeal">
    <h2>{{ detalle()!.strMeal }}</h2>
    <p class="precio">$ {{ precios()[detalle()!.idMeal] | number }}</p>
    <p><strong>Categoría:</strong> {{ detalle()!.strCategory }}</p>
    <p><strong>Ingredientes:</strong></p>
    <ul class="lista-ingredientes">
      <li *ngFor="let ingrediente of detalle()!.ingredientes">{{ ingrediente }}</li>
    </ul>
    <button class="boton-agregar" (click)="agregarAlPedido(detalle()!); cerrarDetalle()">Agregar al pedido</button>
  </div>
</div>

<button type="button" class="boton-arriba" (click)="volverArriba()">Volver arriba</button>

<div class="toast-confirmacion" *ngIf="mostrarConfirmacion()">
  ✓ Agregado al pedido
</div>
